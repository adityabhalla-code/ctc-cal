      confidence: 'Default'

  const lower = clean.toLowerCase();

  const exactMatch = COMPANY_DATABASE.find(
    (c) => c.name.toLowerCase() === lower || lower.includes(c.name.toLowerCase().split(' ')[0])

  if (/(consult|advisory|partners|strategy|audit|associates)/i.test(lower)) {

      matchedName: clean,

      hraPct: 50,
      epfMode: 'full',
      gratuityInCtc: true,
      variablePct: 15,

  if (/(labs|ai|tech|pay|fin|cloud|stack|io|hq|ventures|digital|ware|byte|app)/i.test(lower)) {

      name: clean,
      matchedName: clean,
      category: 'Modern Tech / Startup (Inferred)',

// ============================================================================
// 4. FY 2026-27 INDIAN INCOME TAX & PAYROLL CALCULATION ENGINE
// ============================================================================
function calculateNewRegimeTaxFY2627(taxableIncome) {
  if (taxableIncome <= 0) {
    return { slabTax: 0, rebate87A: 0, surcharge: 0, marginalRelief: 0, cess: 0, totalTax: 0, surchargeRate: 0 };
  }

  // FY 2026-27 New Tax Regime Slabs:
  // 0 - 4L: 0%
  // 4L - 8L: 5% (max 20,000)
  // 8L - 12L: 10% (max 40,000)
  // 12L - 16L: 15% (max 60,000)
  // 16L - 20L: 20% (max 80,000)
  // 20L - 24L: 25% (max 1,00,000)
  // > 24L: 30%
  const computeSlabOnly = (inc) => {
    let tax = 0;
    if (inc > 400000) tax += Math.min(inc - 400000, 400000) * 0.05;
    if (inc > 800000) tax += Math.min(inc - 800000, 400000) * 0.10;
    if (inc > 1200000) tax += Math.min(inc - 1200000, 400000) * 0.15;
    if (inc > 1600000) tax += Math.min(inc - 1600000, 400000) * 0.20;
    if (inc > 2000000) tax += Math.min(inc - 2000000, 400000) * 0.25;
    if (inc > 2400000) tax += (inc - 2400000) * 0.30;
    return tax;
  };

  let slabTax = computeSlabOnly(taxableIncome);
  let rebate87A = 0;

  // Section 87A Rebate: Full tax rebate up to ₹12,00,000 taxable income (up to ₹60,000)
  // Plus marginal relief just above ₹12,00,000
  if (taxableIncome <= 1200000) {
    rebate87A = slabTax;
    slabTax = 0;
  } else if (taxableIncome <= 1275000) {
    const excessIncome = taxableIncome - 1200000;
    if (slabTax > excessIncome) {
      rebate87A = slabTax - excessIncome;
      slabTax = excessIncome;
    }
  }

  // Surcharge calculation with Marginal Relief
  let surchargeRate = 0;
  if (taxableIncome > 20000000) {
    surchargeRate = 0.25; // Capped at 25% under New Regime even above ₹5 Cr
  } else if (taxableIncome > 10000000) {
    surchargeRate = 0.15;
  } else if (taxableIncome > 5000000) {
    surchargeRate = 0.10;
  }

  let rawSurcharge = slabTax * surchargeRate;
  let marginalRelief = 0;

  // Marginal relief at ₹50L, ₹1Cr, ₹2Cr thresholds
  const thresholds = [
    { limit: 5000000, prevRate: 0 },
    { limit: 10000000, prevRate: 0.10 },
    { limit: 20000000, prevRate: 0.15 }
  ];

  for (const t of thresholds) {
    if (taxableIncome > t.limit && taxableIncome <= t.limit + 1500000) {
      const taxAtLimit = computeSlabOnly(t.limit);
      const totalAtLimit = taxAtLimit * (1 + t.prevRate);
      const currentPreCess = slabTax + rawSurcharge;
      const maxAllowedPreCess = totalAtLimit + (taxableIncome - t.limit);
      if (currentPreCess > maxAllowedPreCess) {
        marginalRelief = currentPreCess - maxAllowedPreCess;
        rawSurcharge = Math.max(0, rawSurcharge - marginalRelief);
      }
    }
  }

  const taxPlusSurcharge = slabTax + rawSurcharge;
  const cess = taxPlusSurcharge * 0.04;
  const totalTax = Math.round((taxPlusSurcharge + cess) / 10) * 10;

  return {
    slabTax: Math.round(slabTax),
    rebate87A: Math.round(rebate87A),
    surcharge: Math.round(rawSurcharge),
    marginalRelief: Math.round(marginalRelief),
    cess: Math.round(cess),
    totalTax,
    surchargeRate: surchargeRate * 100
  };
}

function calculateOldRegimeTax(taxableIncome) {
  if (taxableIncome <= 0) {
    return { slabTax: 0, rebate87A: 0, surcharge: 0, marginalRelief: 0, cess: 0, totalTax: 0, surchargeRate: 0 };
  }

  const computeOldSlab = (inc) => {
    let tax = 0;
    if (inc > 250000) tax += Math.min(inc - 250000, 250000) * 0.05;
    if (inc > 500000) tax += Math.min(inc - 500000, 500000) * 0.20;
    if (inc > 1000000) tax += (inc - 1000000) * 0.30;
    return tax;
  };

  let slabTax = computeOldSlab(taxableIncome);
  let rebate87A = 0;
  if (taxableIncome <= 500000) {
    rebate87A = slabTax;
    slabTax = 0;
  }

  let surchargeRate = 0;
  if (taxableIncome > 50000000) surchargeRate = 0.37;
  else if (taxableIncome > 20000000) surchargeRate = 0.25;
  else if (taxableIncome > 10000000) surchargeRate = 0.15;
  else if (taxableIncome > 5000000) surchargeRate = 0.10;

  let rawSurcharge = slabTax * surchargeRate;
  let marginalRelief = 0;

  const thresholds = [
    { limit: 5000000, prevRate: 0 },
    { limit: 10000000, prevRate: 0.10 },
    { limit: 20000000, prevRate: 0.15 },
    { limit: 50000000, prevRate: 0.25 }
  ];

  for (const t of thresholds) {
    if (taxableIncome > t.limit && taxableIncome <= t.limit + 2000000) {
      const taxAtLimit = computeOldSlab(t.limit);
      const totalAtLimit = taxAtLimit * (1 + t.prevRate);
      const currentPreCess = slabTax + rawSurcharge;
      const maxAllowedPreCess = totalAtLimit + (taxableIncome - t.limit);
      if (currentPreCess > maxAllowedPreCess) {
        marginalRelief = currentPreCess - maxAllowedPreCess;
        rawSurcharge = Math.max(0, rawSurcharge - marginalRelief);
      }
    }
  }

  const cess = (slabTax + rawSurcharge) * 0.04;
  const totalTax = Math.round((slabTax + rawSurcharge + cess) / 10) * 10;

  return {
    slabTax: Math.round(slabTax),
    rebate87A: Math.round(rebate87A),
    surcharge: Math.round(rawSurcharge),
    marginalRelief: Math.round(marginalRelief),
    cess: Math.round(cess),
    totalTax,
    surchargeRate: surchargeRate * 100
  };
}

// ============================================================================
// 5. FORMATTING HELPERS (INDIAN NUMBERING SYSTEM)
// ============================================================================
function formatINR(amount, showDecimals = false) {
  if (isNaN(amount) || amount === null) return '₹0';
  const isNeg = amount < 0;
  const absVal = Math.abs(amount);
  const formatted = new Intl.NumberFormat('en-IN', {
    style: 'currency',
    currency: 'INR',
    minimumFractionDigits: showDecimals ? 2 : 0,
    maximumFractionDigits: showDecimals ? 2 : 0
  }).format(absVal);
  return isNeg ? `-${formatted}` : formatted;
}

function formatCompactINR(amount) {
  const abs = Math.abs(amount);
  if (abs >= 10000000) {
    return `₹${(amount / 10000000).toFixed(2).replace(/\.00$/, '')} Cr`;
  }
  if (abs >= 100000) {
    return `₹${(amount / 100000).toFixed(2).replace(/\.00$/, '')} L`;
  }
  return formatINR(amount);
}

function formatIndianCommas(numStr) {
  const digits = String(numStr).replace(/[^0-9]/g, '');
  if (!digits) return '';
  return Number(digits).toLocaleString('en-IN');
}

function App() {
  // Primary Inputs
  const [ctcInput, setCtcInput] = useState('1,20,00,000');
  const [companyQuery, setCompanyQuery] = useState('Google');
  const [selectedProfile, setSelectedProfile] = useState(() => inferCompanyStructure('Google'));
  const [dropdownOpen, setDropdownOpen] = useState(false);

  // Customization Overrides
  const [basicPct, setBasicPct] = useState(40);
  const [hraPct, setHraPct] = useState(50);
  const [epfMode, setEpfMode] = useState('full'); // 'full' | 'capped'
  const [gratuityInCtc, setGratuityInCtc] = useState(true);
  const [variablePct, setVariablePct] = useState(15);
  const [employerNpsPct, setEmployerNpsPct] = useState(0); // 0 to 14% of Basic u/s 80CCD(2)
  const [workState, setWorkState] = useState('KA');
  const [taxRegime, setTaxRegime] = useState('new'); // 'new' | 'old'
  const [oldRegimeDeductions, setOldRegimeDeductions] = useState(450000); // 80C + 80D + HRA exemption
  const [showAdvancedControls, setShowAdvancedControls] = useState(true);

  const dropdownRef = useRef(null);

  // Close autocomplete dropdown on outside click
  useEffect(() => {
    const handleClickOutside = (e) => {
      if (dropdownRef.current && !dropdownRef.current.contains(e.target)) {
        setDropdownOpen(false);
      }
    };
    document.addEventListener('mousedown', handleClickOutside);
    return () => document.removeEventListener('mousedown', handleClickOutside);
  }, []);

  // Apply company profile whenever user picks or types a company
  const applyCompanyProfile = (companyName) => {
    const profile = inferCompanyStructure(companyName);
    setSelectedProfile(profile);
    setBasicPct(profile.basicPct);
    setHraPct(profile.hraPct);
    setEpfMode(profile.epfMode);
    setGratuityInCtc(profile.gratuityInCtc);
    setVariablePct(profile.variablePct);
    setWorkState(profile.defaultState);
    setEmployerNpsPct(0);
  };

  const handleCompanySelect = (companyObj) => {
    setCompanyQuery(companyObj.name);
    setDropdownOpen(false);
    applyCompanyProfile(companyObj.name);
  };

  const handleCompanyInputChange = (e) => {
    const val = e.target.value;
    setCompanyQuery(val);
    setDropdownOpen(true);
    applyCompanyProfile(val);
  };

  const filteredCompanies = useMemo(() => {
    const q = companyQuery.trim().toLowerCase();
    if (!q) return COMPANY_DATABASE;
    return COMPANY_DATABASE.filter(
      (c) => c.name.toLowerCase().includes(q) || c.category.toLowerCase().includes(q)
    );
  }, [companyQuery]);

  const numericCtc = useMemo(() => {
    const cleaned = Number(String(ctcInput).replace(/[^0-9]/g, ''));
    return isNaN(cleaned) ? 0 : cleaned;
  }, [ctcInput]);

  // ==========================================================================
  // CORE PAYROLL & TAX CALCULATION MEMO
  // ==========================================================================
  const breakdown = useMemo(() => {
    const totalCtc = Math.max(0, numericCtc);

    // 1. Variable / Performance Bonus split from Total CTC
    const annualVariableBonus = Math.round(totalCtc * (variablePct / 100));
    const fixedCtc = totalCtc - annualVariableBonus;

    // 2. Basic Salary & HRA (calculated on Fixed CTC)
    const annualBasic = Math.round(fixedCtc * (basicPct / 100));
    const annualHra = Math.round(annualBasic * (hraPct / 100));

    // 3. Employer Retirals embedded inside Fixed CTC
    const annualEmployerEpf =
      epfMode === 'full' ? Math.round(annualBasic * 0.12) : Math.min(21600, Math.round(annualBasic * 0.12));

    const annualGratuity = gratuityInCtc ? Math.round(annualBasic * 0.0481) : 0;

    // Employer NPS u/s 80CCD(2) - carved out of Special Allowance inside Fixed CTC
    const maxNpsRate = taxRegime === 'new' ? 14 : 10;
    const effectiveNpsPct = Math.min(employerNpsPct, maxNpsRate);
    const annualEmployerNps = Math.round(annualBasic * (effectiveNpsPct / 100));

    // 4. Special Allowance (balancing figure of Fixed CTC)
    const rawSpecialAllowance =
      fixedCtc - (annualBasic + annualHra + annualEmployerEpf + annualGratuity + annualEmployerNps);
    const annualSpecialAllowance = Math.max(0, rawSpecialAllowance);

    // 5. Gross Salary (Taxable Salary Base before deductions)
    const grossFixedSalary = annualBasic + annualHra + annualSpecialAllowance;
    const grossTotalSalary = grossFixedSalary + annualVariableBonus;

    // 6. Standard Deduction & Chapter VI-A Deductions
    const standardDeduction = taxRegime === 'new' ? Math.min(75000, grossTotalSalary) : Math.min(50000, grossTotalSalary);
    const npsDeduction = annualEmployerNps; // Deductible u/s 80CCD(2) in both regimes
    const extraOldDeductions = taxRegime === 'old' ? Math.min(oldRegimeDeductions, Math.max(0, grossTotalSalary - standardDeduction)) : 0;

    const netTaxableIncome = Math.max(
      0,
      grossTotalSalary - standardDeduction - npsDeduction - extraOldDeductions
    );

    // Also compute Taxable Income for Fixed Salary alone (to isolate monthly fixed TDS vs bonus TDS)
    const fixedTaxableIncome = Math.max(
      0,
      grossFixedSalary - standardDeduction - npsDeduction - extraOldDeductions
    );

    // 7. Compute Income Tax (Total & Fixed-only)
    const taxResult =
      taxRegime === 'new'
        ? calculateNewRegimeTaxFY2627(netTaxableIncome)
        : calculateOldRegimeTax(netTaxableIncome);

    const fixedTaxResult =
      taxRegime === 'new'
        ? calculateNewRegimeTaxFY2627(fixedTaxableIncome)
        : calculateOldRegimeTax(fixedTaxableIncome);

    // Also calculate tax WITHOUT Employer NPS to display exact tax saved by NPS
    const taxableWithoutNps = netTaxableIncome + npsDeduction;
    const taxWithoutNps =
      taxRegime === 'new'
        ? calculateNewRegimeTaxFY2627(taxableWithoutNps).totalTax
        : calculateOldRegimeTax(taxableWithoutNps).totalTax;
    const npsTaxSaved = Math.max(0, taxWithoutNps - taxResult.totalTax);

    // 8. Employee Statutory Deductions
    const annualEmployeeEpf =
      epfMode === 'full' ? Math.round(annualBasic * 0.12) : Math.min(21600, Math.round(annualBasic * 0.12));

    const monthlyPT = STATES_CONFIG[workState]?.monthlyPT ?? 200;
    const annualPT = monthlyPT * 12;

    // 9. Net In-Hand Calculations
    // Annual Total Net In-Hand (including post-tax variable bonus)
    const annualTotalInHand = Math.max(
      0,
      grossTotalSalary - taxResult.totalTax - annualEmployeeEpf - annualPT
    );

    // Annual Fixed Net In-Hand (excluding variable bonus, using fixed-salary TDS)
    const annualFixedInHand = Math.max(
      0,
      grossFixedSalary - fixedTaxResult.totalTax - annualEmployeeEpf - annualPT
    );

    const monthlyFixedInHand = Math.round(annualFixedInHand / 12);
    const monthlyAvgWithBonus = Math.round(annualTotalInHand / 12);

    // Bonus TDS & Net Bonus
    const bonusTax = Math.max(0, taxResult.totalTax - fixedTaxResult.totalTax);
    const netAnnualBonus = Math.max(0, annualVariableBonus - bonusTax);

    // Total Wealth Created (In-Hand + Employee EPF + Employer EPF + Employer NPS + Gratuity)
    const annualRetirementWealth = annualEmployeeEpf + annualEmployerEpf + annualEmployerNps + annualGratuity;
    const effectiveTaxRate = totalCtc > 0 ? ((taxResult.totalTax / totalCtc) * 100).toFixed(1) : '0.0';
    const inHandPctOfCtc = totalCtc > 0 ? ((annualTotalInHand / totalCtc) * 100).toFixed(1) : '0.0';

    // Surcharge cliff proximity check (₹50L and ₹1Cr)
    let cliffAlert = null;
    if (taxRegime === 'new') {
      if (netTaxableIncome > 10000000 && netTaxableIncome <= 11200000) {
        cliffAlert = {
          type: 'crossed_1cr',
          title: 'Just Above ₹1 Crore Surcharge Cliff (15% Surcharge Active)',
          message: `Your taxable income (${formatINR(netTaxableIncome)}) is ${formatINR(
            netTaxableIncome - 10000000
          )} above ₹1 Cr, triggering a 15% surcharge instead of 10%. Enabling 14% Employer NPS u/s 80CCD(2) can pull you back under ₹1 Cr and save up to ₹4.4+ lakh in tax.`
        };
      } else if (netTaxableIncome > 9200000 && netTaxableIncome <= 10000000) {
        cliffAlert = {
          type: 'near_1cr',
          title: 'Close to ₹1 Crore Surcharge Cliff (Headroom: ' + formatINR(10000000 - netTaxableIncome) + ')',
          message: `You are currently in the 10% surcharge bracket. Any extra bonus, FD interest, or capital gains exceeding ${formatINR(
            10000000 - netTaxableIncome
          )} will push your surcharge from 10% to 15% across your entire tax liability.`
        };
      } else if (netTaxableIncome > 5000000 && netTaxableIncome <= 5600000) {
        cliffAlert = {
          type: 'crossed_50l',
          title: 'Just Above ₹50 Lakh Surcharge Threshold (10% Surcharge Active)',
          message: `Your taxable income (${formatINR(netTaxableIncome)}) crossed ₹50L by ${formatINR(
            netTaxableIncome - 5000000
          )}. Employer NPS u/s 80CCD(2) can reduce taxable income below ₹50L to eliminate the 10% surcharge.`
        };
      }
    }

    return {
      totalCtc,
      fixedCtc,
      annualVariableBonus,
      netAnnualBonus,
      bonusTax,
      annualBasic,
      annualHra,
      annualSpecialAllowance,
      annualEmployerEpf,
      annualGratuity,
      annualEmployerNps,
      effectiveNpsPct,
      grossFixedSalary,
      grossTotalSalary,
      standardDeduction,
      npsDeduction,
      extraOldDeductions,
      netTaxableIncome,
      taxResult,
      fixedTaxResult,
      npsTaxSaved,
      annualEmployeeEpf,
      monthlyPT,
      annualPT,
      annualTotalInHand,
      annualFixedInHand,
      monthlyFixedInHand,
      monthlyAvgWithBonus,
      annualRetirementWealth,
      effectiveTaxRate,
      inHandPctOfCtc,
      cliffAlert
    };
  }, [
    numericCtc,
    basicPct,
    hraPct,
    epfMode,
    gratuityInCtc,
    variablePct,
    employerNpsPct,
    workState,
    taxRegime,
    oldRegimeDeductions
  ]);

  // Preset CTC chips
  const ctcPresets = [
    { label: '30 LPA', val: '30,00,000' },
    { label: '50 LPA', val: '50,00,000' },
    { label: '75 LPA', val: '75,00,000' },
    { label: '1 Cr', val: '1,00,00,000' },
    { label: '1.2 Cr', val: '1,20,00,000' },
    { label: '1.5 Cr', val: '1,50,00,000' }
  ];

  // Visual bar segments (percentages of Total CTC)
  const chartSegments = useMemo(() => {

    const epfNpsPct =

    const gratuityPtPct = ((breakdown.annualGratuity + breakdown.annualPT) / total) * 100;

      {

        color: 'bg-amber-400',
        dot: 'bg-amber-400'
      }
    ];
  }, [breakdown]);

  return (

      {/* Top Executive Header */}

                    </button>

            </div>

            {/* Company Name Search & Auto-Inference */}
            <div className="lg:col-span-6 space-y-3" ref={dropdownRef}>

                      filteredCompanies.map((comp) => (
                        <button
                          key={comp.name}

                          className="w-full text-left px-4 py-2.5 hover:bg-slate-50 flex items-center justify-between gap-2 transition-colors"

                          <div>
                            <div className="text-sm font-semibold text-slate-900">{comp.name}</div>
                            <div className="text-[11px] text-slate-500">{comp.policySummary}</div>
                          </div>
                          <span className="text-[10px] font-semibold px-2 py-0.5 rounded bg-slate-100 text-slate-600 shrink-0">
                            {comp.category.split('/')[0].trim()}

                        </button>
                      ))

                      <div className="p-4 text-xs text-slate-600">
                        <div className="font-semibold text-slate-800 mb-1">

                        <p>{selectedProfile.policySummary}</p>
                      </div>
                    )}

              {/* Quick Company Chips */}

                      setCompanyQuery(name);

                    className={`px-2.5 py-1 rounded-lg text-xs font-medium transition-all ${
                      companyQuery.toLowerCase() === name.toLowerCase()

                        : 'bg-slate-100 text-slate-600 hover:bg-slate-200'

                    {name}
                  </button>
                ))}

            <div className="mt-2 text-xs text-slate-500 flex items-center justify-between">

              <span className="font-semibold text-slate-700 tabular-nums">

              <span className="font-semibold text-slate-700 tabular-nums">
                {formatINR(breakdown.monthlyPT)}/mo
              </span>
            </div>

            <div className="flex items-center justify-between text-teal-700 text-xs font-bold uppercase tracking-wider">

              <AlertTriangle className="w-5 h-5 text-amber-600 shrink-0 mt-0.5" />

           ==================================================================== */}

          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-4">

              <h2 className="text-base font-bold text-slate-900">Where Every Rupee of Your CTC Goes</h2>

                    {seg.pct.toFixed(1)}%
                  </span>
                </div>
              </div>

        {/* ====================================================================
            SECTION 4: TWO-COLUMN WORKSPACE (CUSTOMIZATION + DETAILED PAYSLIP)

                  <div className="grid grid-cols-2 gap-2">

                      onClick={() => setEpfMode('full')}

                        epfMode === 'full'

                    >
                      <div className="text-xs font-bold">Full 12% of Basic</div>
                      <div className="text-[10px] opacity-80 mt-0.5">Standard MNCs / Consulting</div>
                    </button>
                    <button
                      type="button"
                      onClick={() => setEpfMode('capped')}
                      className={`p-2.5 rounded-xl border text-left transition-all ${
                        epfMode === 'capped'
                          ? 'bg-emerald-50 border-emerald-500 text-emerald-950 shadow-xs'
                          : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'
                      }`}
                    >
                      <div className="text-xs font-bold">Capped ₹1,800/mo</div>
                      <div className="text-[10px] opacity-80 mt-0.5">Max Monthly In-Hand Cash</div>
                    </button>
                  </div>
                </div>

                    <label className="text-xs font-bold text-emerald-950 flex items-center gap-1.5">
                      <Sparkles className="w-3.5 h-3.5 text-emerald-600" />
                      Employer NPS u/s 80CCD(2)
                    </label>
                    <span className="text-xs font-extrabold text-emerald-700 bg-white px-2 py-0.5 rounded border border-emerald-200 tabular-nums">
                      {breakdown.effectiveNpsPct}% of Basic

                  <input
                    type="range"
                    min="0"

                    step="1"
                    value={breakdown.effectiveNpsPct}

                    className="w-full accent-emerald-600 cursor-pointer"
                  />
                  <div className="flex items-center justify-between text-[11px] text-emerald-800">
                    <span>Contribution: {formatINR(breakdown.annualEmployerNps)}/yr</span>

                      <span>Up to {taxRegime === 'new' ? '14%' : '10%'} tax-free</span>

                    type="range"
                    min="35"
                    max="60"
                    step="1"
                    value={basicPct}
                    onChange={(e) => setBasicPct(Number(e.target.value))}
                    className="w-full accent-indigo-600 cursor-pointer"
                  />
                  <div className="flex justify-between text-[10px] text-slate-400">
                    <span>35% (Startup)</span>
                    <span>40% (Tech)</span>
                    <span>50% (MNC)</span>
                    <span>60%</span>
                  </div>
                </div>

                {/* 4. Variable / Performance Bonus % Slider */}
                <div className="space-y-1.5">
                  <div className="flex items-center justify-between">
                    <label className="text-xs font-bold text-slate-700">Variable / Annual Bonus (% of CTC)</label>
                    <span className="text-xs font-bold text-slate-900 tabular-nums">
                      {variablePct}% ({formatCompactINR(breakdown.annualVariableBonus)}/yr)
                    </span>
                  </div>
                  <input
                    type="range"
                    min="0"
                    max="30"
                    step="1"
                    value={variablePct}
                    onChange={(e) => setVariablePct(Number(e.target.value))}
                    className="w-full accent-indigo-600 cursor-pointer"
                  />
                  <div className="flex justify-between text-[10px] text-slate-400">
                    <span>0% (100% Fixed)</span>
                    <span>10%</span>
                    <span>15%</span>
                    <span>20%</span>
                    <span>30%</span>
                  </div>
                </div>

                {/* 5. Work State (Professional Tax) */}
                <div className="space-y-1.5">
                  <label className="text-xs font-bold text-slate-700 flex items-center gap-1.5">
                    <MapPin className="w-3.5 h-3.5 text-slate-500" />
                    Work Location (Professional Tax)
                  </label>
                  <select
                    value={workState}
                    onChange={(e) => setWorkState(e.target.value)}
                    className="w-full px-3 py-2 text-xs font-semibold text-slate-800 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500"
                  >
                    {Object.values(STATES_CONFIG).map((st) => (
                      <option key={st.code} value={st.code}>
                        {st.name} — ₹{st.monthlyPT}/mo PT
                      </option>
                    ))}
                  </select>
                </div>

                {/* 6. Gratuity in CTC Toggle */}
                <div className="flex items-center justify-between pt-2 border-t border-slate-100">
                  <div>
                    <div className="text-xs font-bold text-slate-700">Gratuity Part of CTC (4.81% Basic)</div>
                    <div className="text-[11px] text-slate-500">
                      Deducted from fixed CTC ({formatINR(breakdown.annualGratuity)}/yr)
                    </div>
                  </div>
                  <button
                    type="button"
                    onClick={() => setGratuityInCtc((g) => !g)}
                    className={`w-11 h-6 rounded-full transition-colors p-0.5 ${
                      gratuityInCtc ? 'bg-indigo-600' : 'bg-slate-300'
                    }`}
                  >
                    <div
                      className={`w-5 h-5 rounded-full bg-white shadow-sm transform transition-transform ${
                        gratuityInCtc ? 'translate-x-5' : 'translate-x-0'
                      }`}
                    />
                  </button>
                </div>

                {/* Old Regime Extra Deductions Input (only when Old Regime selected) */}
                {taxRegime === 'old' && (
                  <div className="p-3.5 rounded-xl bg-indigo-50/70 border border-indigo-200 space-y-2">
                    <label className="text-xs font-bold text-indigo-950 block">
                      Old Regime Exemptions (HRA + 80C + 80D + Home Loan)
                    </label>
                    <input
                      type="text"
                      inputMode="numeric"
                      value={formatIndianCommas(oldRegimeDeductions)}
                      onChange={(e) => {
                        const v = Number(String(e.target.value).replace(/[^0-9]/g, ''));
                        setOldRegimeDeductions(isNaN(v) ? 0 : v);
                      }}
                      className="w-full px-3 py-2 text-sm font-bold text-slate-900 bg-white border border-indigo-300 rounded-lg tabular-nums"
                    />
                    <p className="text-[11px] text-indigo-700">
                      Tip: Under New Regime FY 2026–27, you save{' '}
                      <strong>
                        {formatINR(
                          Math.abs(
                            calculateNewRegimeTaxFY2627(
                              Math.max(0, breakdown.grossTotalSalary - 75000 - breakdown.npsDeduction)
                            ).totalTax - breakdown.taxResult.totalTax
                          )
                        )}
                      </strong>{' '}
                      compared to Old Regime with these deductions.
                    </p>
                  </div>
                )}
              </div>
            )}
          </section>

          {/* RIGHT COLUMN (7 cols): Complete Payslip-Style Monthly & Annual Breakdown */}
          <section className="lg:col-span-7 bg-white rounded-2xl border border-slate-200/90 shadow-sm overflow-hidden">
            <div className="px-5 sm:px-6 py-4 bg-slate-900 text-white flex flex-col sm:flex-row sm:items-center justify-between gap-2">
              <div className="flex items-center gap-2">
                <FileSpreadsheet className="w-4 h-4 text-emerald-400" />
                <h2 className="text-base font-bold">Complete Salary &amp; Deduction Statement</h2>
              </div>
              <span className="text-xs text-slate-300">
                {selectedProfile.matchedName} • {taxRegime === 'new' ? 'New Regime FY 26–27' : 'Old Regime'}
              </span>
            </div>

            <div className="overflow-x-auto">
              <table className="w-full text-left border-collapse">
                <thead>
                  <tr className="bg-slate-50 border-b border-slate-200 text-[11px] font-bold uppercase tracking-wider text-slate-500">
                    <th className="py-3 px-5">Salary Component</th>
                    <th className="py-3 px-4 text-right">Monthly (₹)</th>
                    <th className="py-3 px-5 text-right">Annual (₹)</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100 text-sm">
                  {/* GROUP A: GROSS EARNINGS */}
                  <tr className="bg-slate-50/60">
                    <td colSpan={3} className="py-2 px-5 text-[11px] font-bold uppercase tracking-wider text-slate-500">
                      1. Gross Cash Earnings
                    </td>
                  </tr>
                  <tr>
                    <td className="py-2.5 px-5 font-medium text-slate-800">
                      Basic Salary <span className="text-xs text-slate-400">({basicPct}% of Fixed)</span>
                    </td>
                    <td className="py-2.5 px-4 text-right tabular-nums text-slate-700">
                      {formatINR(Math.round(breakdown.annualBasic / 12))}
                    </td>
                    <td className="py-2.5 px-5 text-right tabular-nums font-medium text-slate-900">
                      {formatINR(breakdown.annualBasic)}
                    </td>
                  </tr>
                  <tr>
                    <td className="py-2.5 px-5 font-medium text-slate-800">
                      House Rent Allowance (HRA) <span className="text-xs text-slate-400">({hraPct}% of Basic)</span>
                    </td>
                    <td className="py-2.5 px-4 text-right tabular-nums text-slate-700">
                      {formatINR(Math.round(breakdown.annualHra / 12))}
                    </td>
                    <td className="py-2.5 px-5 text-right tabular-nums font-medium text-slate-900">
                      {formatINR(breakdown.annualHra)}
                    </td>
                  </tr>
                  <tr>
                    <td className="py-2.5 px-5 font-medium text-slate-800">
                      Special / Flexible Allowance
                    </td>
                    <td className="py-2.5 px-4 text-right tabular-nums text-slate-700">
                      {formatINR(Math.round(breakdown.annualSpecialAllowance / 12))}
                    </td>
                    <td className="py-2.5 px-5 text-right tabular-nums font-medium text-slate-900">
                      {formatINR(breakdown.annualSpecialAllowance)}
                    </td>
                  </tr>
                  <tr className="bg-slate-50/80 font-semibold">
                    <td className="py-2.5 px-5 text-slate-900">Gross Fixed Salary (A)</td>
                    <td className="py-2.5 px-4 text-right tabular-nums text-slate-900">
                      {formatINR(Math.round(breakdown.grossFixedSalary / 12))}
                    </td>
                    <td className="py-2.5 px-5 text-right tabular-nums text-slate-900">
                      {formatINR(breakdown.grossFixedSalary)}
                    </td>
                  </tr>

                  {/* GROUP B: EMPLOYER CONTRIBUTIONS IN CTC */}
                  <tr className="bg-slate-50/60">
                    <td colSpan={3} className="py-2 px-5 text-[11px] font-bold uppercase tracking-wider text-slate-500">
                      2. Employer Retiral Contributions (Part of Fixed CTC)
                    </td>
                  </tr>
                  <tr>
                    <td className="py-2.5 px-5 font-medium text-slate-700">
                      Employer EPF Contribution{' '}
                      <span className="text-xs text-slate-400">
                        ({epfMode === 'full' ? '12% Basic' : 'Capped ₹1,800/mo'})
                      </span>
                    </td>
                    <td className="py-2.5 px-4 text-right tabular-nums text-slate-600">
                      {formatINR(Math.round(breakdown.annualEmployerEpf / 12))}
                    </td>
                    <td className="py-2.5 px-5 text-right tabular-nums text-slate-800">
                      {formatINR(breakdown.annualEmployerEpf)}
                    </td>
                  </tr>
                  {breakdown.annualEmployerNps > 0 && (
                    <tr className="bg-emerald-50/40">
                      <td className="py-2.5 px-5 font-medium text-emerald-900">
                        Employer NPS Contribution u/s 80CCD(2){' '}
                        <span className="text-xs text-emerald-600">({breakdown.effectiveNpsPct}% Basic)</span>
                      </td>
                      <td className="py-2.5 px-4 text-right tabular-nums text-emerald-800">
                        {formatINR(Math.round(breakdown.annualEmployerNps / 12))}
                      </td>
                      <td className="py-2.5 px-5 text-right tabular-nums font-semibold text-emerald-900">
                        {formatINR(breakdown.annualEmployerNps)}
                      </td>
                    </tr>
                  )}
                  <tr>
                    <td className="py-2.5 px-5 font-medium text-slate-700">
                      Gratuity Provision <span className="text-xs text-slate-400">(4.81% of Basic)</span>
                    </td>
                    <td className="py-2.5 px-4 text-right tabular-nums text-slate-600">
                      {formatINR(Math.round(breakdown.annualGratuity / 12))}
                    </td>
                    <td className="py-2.5 px-5 text-right tabular-nums text-slate-800">
                      {formatINR(breakdown.annualGratuity)}
                    </td>
                  </tr>

                  {/* GROUP C: MONTHLY DEDUCTIONS FROM GROSS */}
                  <tr className="bg-rose-50/50">
                    <td colSpan={3} className="py-2 px-5 text-[11px] font-bold uppercase tracking-wider text-rose-700">
                      3. Statutory &amp; Tax Deductions (On Fixed Salary)
                    </td>
                  </tr>
                  <tr>
                    <td className="py-2.5 px-5 font-medium text-slate-700">
                      Employee EPF Contribution
                    </td>
                    <td className="py-2.5 px-4 text-right tabular-nums text-rose-600">
                      -{formatINR(Math.round(breakdown.annualEmployeeEpf / 12))}
                    </td>
                    <td className="py-2.5 px-5 text-right tabular-nums text-rose-600">
                      -{formatINR(breakdown.annualEmployeeEpf)}
                    </td>
                  </tr>
                  <tr>
                    <td className="py-2.5 px-5 font-medium text-slate-700">
                      Professional Tax <span className="text-xs text-slate-400">({workState})</span>
                    </td>
                    <td className="py-2.5 px-4 text-right tabular-nums text-rose-600">
                      -{formatINR(breakdown.monthlyPT)}
                    </td>
                    <td className="py-2.5 px-5 text-right tabular-nums text-rose-600">
                      -{formatINR(breakdown.annualPT)}
                    </td>
                  </tr>
                  <tr>
                    <td className="py-2.5 px-5 font-medium text-slate-700">
                      Income Tax (Base Slab Tax on Fixed)
                    </td>
                    <td className="py-2.5 px-4 text-right tabular-nums text-rose-600">
                      -{formatINR(Math.round(breakdown.fixedTaxResult.slabTax / 12))}
                    </td>
                    <td className="py-2.5 px-5 text-right tabular-nums text-rose-600">
                      -{formatINR(breakdown.fixedTaxResult.slabTax)}
                    </td>
                  </tr>
                  {breakdown.fixedTaxResult.surcharge > 0 && (
                    <tr>
                      <td className="py-2.5 px-5 font-medium text-slate-700">
                        Surcharge ({breakdown.fixedTaxResult.surchargeRate}%)
                        {breakdown.fixedTaxResult.marginalRelief > 0 && (
                          <span className="ml-1.5 text-[10px] bg-emerald-100 text-emerald-800 px-1.5 py-0.5 rounded font-semibold">
                            Marginal Relief Applied
                          </span>
                        )}
                      </td>
                      <td className="py-2.5 px-4 text-right tabular-nums text-rose-600">
                        -{formatINR(Math.round(breakdown.fixedTaxResult.surcharge / 12))}
                      </td>
                      <td className="py-2.5 px-5 text-right tabular-nums text-rose-600">
                        -{formatINR(breakdown.fixedTaxResult.surcharge)}
                      </td>
                    </tr>
                  )}
                  <tr>
                    <td className="py-2.5 px-5 font-medium text-slate-700">
                      Health &amp; Education Cess (4%)
                    </td>
                    <td className="py-2.5 px-4 text-right tabular-nums text-rose-600">
                      -{formatINR(Math.round(breakdown.fixedTaxResult.cess / 12))}
                    </td>
                    <td className="py-2.5 px-5 text-right tabular-nums text-rose-600">
                      -{formatINR(breakdown.fixedTaxResult.cess)}
                    </td>
                  </tr>

                  {/* NET FIXED IN-HAND ROW */}
                  <tr className="bg-emerald-50 border-t-2 border-emerald-500">
                    <td className="py-3.5 px-5 font-extrabold text-emerald-950 text-base">
                      Net Fixed In-Hand Take-Home
                    </td>
                    <td className="py-3.5 px-4 text-right tabular-nums font-extrabold text-emerald-700 text-base sm:text-lg">
                      {formatINR(breakdown.monthlyFixedInHand)}
                    </td>
                    <td className="py-3.5 px-5 text-right tabular-nums font-extrabold text-emerald-900 text-base">
                      {formatINR(breakdown.annualFixedInHand)}
                    </td>
                  </tr>

                  {/* GROUP D: VARIABLE BONUS SECTION (IF > 0) */}
                  {breakdown.annualVariableBonus > 0 && (
                    <>
                      <tr className="bg-indigo-50/50">
                        <td
                          colSpan={3}
                          className="py-2 px-5 text-[11px] font-bold uppercase tracking-wider text-indigo-700"
                        >
                          4. Annual Performance / Variable Bonus ({variablePct}% of CTC)
                        </td>
                      </tr>
                      <tr>
                        <td className="py-2.5 px-5 font-medium text-slate-700">
                          Gross Annual Variable Bonus
                        </td>
                        <td className="py-2.5 px-4 text-right tabular-nums text-slate-400 text-xs">
                          Paid Annually
                        </td>
                        <td className="py-2.5 px-5 text-right tabular-nums font-medium text-slate-900">
                          {formatINR(breakdown.annualVariableBonus)}
                        </td>
                      </tr>
                      <tr>
                        <td className="py-2.5 px-5 font-medium text-slate-700">
                          TDS on Variable Bonus (Marginal Rate)
                        </td>
                        <td className="py-2.5 px-4 text-right tabular-nums text-slate-400 text-xs">—</td>
                        <td className="py-2.5 px-5 text-right tabular-nums text-rose-600">
                          -{formatINR(breakdown.bonusTax)}
                        </td>
                      </tr>
                      <tr className="bg-slate-900 text-white font-bold">
                        <td className="py-3 px-5">
                          Total Net In-Hand (Fixed + Post-Tax Bonus)
                        </td>
                        <td className="py-3 px-4 text-right tabular-nums text-emerald-300">
                          {formatINR(breakdown.monthlyAvgWithBonus)}/mo avg
                        </td>
                        <td className="py-3 px-5 text-right tabular-nums text-emerald-300">
                          {formatINR(breakdown.annualTotalInHand)}
                        </td>
                      </tr>
                    </>
                  )}
                </tbody>
              </table>
            </div>
          </section>
        </div>

        {/* Footnote / Disclaimer */}
        <footer className="text-center text-[11px] text-slate-400 pt-2">
          Calculations follow Indian Income Tax slabs &amp; surcharge rules for FY 2026–27 (AY 2027–28), including ₹75,000 standard deduction under New Regime, Section 87A rebate up to ₹12L, marginal surcharge relief at ₹50L/₹1Cr/₹2Cr, and Section 80CCD(2) Employer NPS up to 14% of Basic.
        </footer>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

  </script>
</body>
</html>
